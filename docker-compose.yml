version: '3.8'

services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: hindsight
    ports:
      - "8888:8888" # API
      - "9999:9999" # UI
    environment:
      - HINDSIGHT_API_LLM_PROVIDER=openai
      - HINDSIGHT_API_LLM_API_KEY=${GROQ_API_KEY}
      - HINDSIGHT_API_LLM_BASE_URL=https://api.groq.com/openai/v1
      - HINDSIGHT_API_LLM_MODEL=openai/gpt-oss-120b
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    restart: unless-stopped

  hydradb:
    image: ghcr.io/hydra-db/hydradb:latest
    container_name: hydradb
    user: "${UID}:${GID}"
    ports:
      - "7687:7687" # Bolt
      - "8443:8443" # HTTPS
      - "9090:9090" # Metrics
    environment:
      - CLOUD_PROVIDER=local
      - LOCAL_PATH=/data/store
      - GRAPH_NAMESPACE=default
      - GRAPH_ID=default
      - GRAPH_CELL_ID=cell-0
      - GRAPH_CELLS=cell-0
      - GRAPH_NODE_ID=node-0
      - GRAPH_BOLT_NODE_ADDRESSES=node-0=127.0.0.1:7687
      - GRAPH_ADVERTISED_BOLT_ADDR=127.0.0.1:7687
      - GRAPH_DATA_CACHE_DIR=/data/cache
      - GRAPH_AUTH_TOKEN_FILE=/data/auth-token
      - GRAPH_ALLOW_PLAINTEXT=true
      - RUST_MIN_STACK=33554432
    volumes:
      - ./hydradb-data:/data
    restart: unless-stopped

volumes:
  hindsight-data:
